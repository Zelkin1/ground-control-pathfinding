# Settings of the gcmod movement mod. Put this file next to gc.exe, with wsock32.dll and
# gcmod_core.dll. Each line is "name = value"; text after '#' is a comment. The core of the mod
# reads this file each time it loads; to apply a change during a game, copy gcmod_core.dll into
# the game folder again, which reloads the core. gcmod.log, next to gc.exe, lists the settings that
# the mod read and the lines it could not use.

# Key that turns the whole mod on or off during a mission: F1 to F12.
toggle_key = F9

# Movement mode, as the simulator option --avoid: "form" (formation following with ORCA
# avoidance) or "coord" (form, plus the coordination between squads below).
avoid = coord

# Switches of formation following, "on" or "off". docs/SWITCHES.md says what each one does. The
# values below are the defaults.
driving = on
smooth = on
widebends = on
formation = on
lanes = on
detour = on
tightbends = on
factiontuning = on
smoothstop = on
fullsearch = on
setupthreads = on
setupaccumulate = off
smoothreorder = on
freeparking = on
wholeparked = on
parkedbox = on

# An APC does not avoid the units of its team that drive to board it, and their squads do not
# coordinate with its squad. The coordination part acts only with "avoid = coord".
ignoreboarders = on

# Switches of the coordination between squads. They act only with "avoid = coord".
friendcoord = on
crossing = on
keepright = on
turns = on
speedfirst = on
leastdelay = on
pass = on
formfirst = on
keeproute = on
parkreroute = on
parkrobust = on
partialshift = on
speedreplan = on
timedshift = on
narrowpass = on
infantryshape = on
