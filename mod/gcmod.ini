# Settings of Ground Control: Second Drop, an unofficial remaster mod of Ground Control. Put this
# file next to gc.exe, with wsock32.dll and gcmod_core.dll. Each line is "name = value"; text after
# '#' is a comment. The core of the mod reads this file each time it loads; to apply a change
# during a game, copy gcmod_core.dll into the game folder again, which reloads the core. gcmod.log,
# next to gc.exe, lists the settings that the mod read and the lines it could not use.

# Log of the mod: "on" writes its lines to gcmod.log, "off" leaves out every line that follows this
# one, except the few that the loader itself writes, such as each core load.
log = on

# Key that turns the whole mod on or off during a mission: F1 to F12, but not F10, which shows or
# hides the text of the mod at the top right of the screen.
toggle_key = F9

# Modern screen sizes: "on" adds 1920x1080, 2560x1440 and 3840x2160 to the sizes of the video
# menu of the game (up to 1024x768), each one only if the display offers it and it is not larger
# than the Windows desktop. "off" keeps the menu of the game.
modern_resolution = on

# Interface scale: a number above 1 makes the menus, the in-game interface and the cursor that
# many times larger at the modern sizes above, for example 1.5
# at 1920x1080 shows the interface as at 1280x720, while the 3D view keeps every screen pixel.
# The interface keeps room for at least 640x480, so the largest number is the screen height
# divided by 480. "off" keeps the interface at its size in pixels. The game places its interface
# when a menu page opens or a mission starts, so after a change of this line, start the game again.
ui_scale = 1.5

# The mod writes this line itself: the modern size that the video menu applied last, or "off"
# for a size of the game. The game saves only its own sizes, so the mod gives its first screen
# this size (with an older wsock32.dll than 0.4.0, the game starts at 1024x768 and changes to it).
resolution = off

# Movement mode, as the simulator option --avoid: "form" (formation following with ORCA
# avoidance) or "coord" (form, plus the coordination between squads below).
avoid = coord

# Switches of formation following, "on" or "off". docs/SWITCHES.md says what each one does. The
# values below are the defaults.
driving = on
smooth = on
widebends = on
formation = on
lanes = on
detour = on
tightbends = on
factiontuning = on
smoothstop = on
fullsearch = on
setupthreads = on
setupaccumulate = off
smoothreorder = on
freeparking = on
wholeparked = on

# When several selected squads get one move order, each squad takes the position on its own side
# of the row, so the squads do not cross each other on the way.
keeporder = on

# A left click on ground with no unit under the cursor deselects every squad, so that orders go
# only to the squads selected after it. With this switch on, a left click on empty ground moves no
# squad, even when the game option "leftclickmovement" is on.
clickdeselect = on

# While the middle mouse button is held, moving the mouse turns the camera as the screen borders
# did in the base game: left and right turn it around, up and down tilt it. The cursor stays where
# the button went down. With this switch on, the screen borders no longer turn the camera.
middlerotate = on

# Sensitivity of that turn: a factor above 0 on the turn per pixel of mouse movement, such as 0.5
# for half as fast or 2 for twice as fast. The rotation speed option of the game scales it too.
middlerotate_sensitivity = 1.0

# Music on repeat: "on" keeps the music that starts while a mission loads playing during the
# mission, and plays it again from the start each time it ends, until the mission ends. The base
# game fades it into the ambient sound of the mission (wind, jungle) a few seconds after the
# mission starts; with "on", both play. A music track that the mission itself starts still takes
# its place. "off" keeps the music of the game.
music_loop = off

# At a new order, the route is searched again with the parked squads as blocking terrain, so the
# squad drives around them instead of through them.
avoidparked = on

# Backward moves: a move order given with the key below held makes a squad of vehicles drive
# backward to its destination, wherever it lies (a unit first turns on the spot until its rear
# points along its way), at 30 % of its top speed, each unit at its own pace, along the route of
# the game without smoothing, still facing away from the destination when it arrives. Queued orders given
# with the key held drive backward too. Infantry always moves forward.
reverse = on
# Key to hold for a backward move order: alt, ctrl or shift.
reverse_key = alt

# Run-over kills: a vehicle that drives at 3 m/s or faster kills the enemy infantry that it drives
# over, and no longer steers around it. Own and allied infantry are safe.
crush = on

# Hit slowdown: in the game, a unit hit by fire drives slower and turns its turret slower for a
# few seconds. "on" removes both slowdowns; "off" keeps the game rule.
disablehitslow = on

# An APC does not avoid the units of its team that drive to board it, and their squads do not
# coordinate with its squad. The coordination part acts only with "avoid = coord".
ignoreboarders = on

# Switches of the coordination between squads. They act only with "avoid = coord".
friendcoord = on
parkreroute = on
parkrobust = on
# A moving squad predicts the paths of the other moving squads. It re-routes around them, or it
# slows down early, so that it does not have to wait for them.
moveahead = on
# At a crossing, the squad that slows down for "moveahead" keeps its full speed longer, and then
# slows down later and more firmly, near the crossing.
lateyield = on
# Squads that meet head-on pass each other closer: their routes move apart only by what the gap
# still needs past the offset that they already have from each other.
closepass = on
